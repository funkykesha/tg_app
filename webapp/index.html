<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Курс валют</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8a8a8a);
      --card: var(--tg-theme-secondary-bg-color, #f2f2f6);
      --accent: var(--tg-theme-button-color, #2481cc);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --up: #1aa260;
      --down: #e0453a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .today {
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .today .weekday { font-size: 14px; opacity: .85; text-transform: capitalize; }
    .today .date { font-size: 26px; font-weight: 700; margin-top: 4px; }
    .today .time { font-size: 14px; opacity: .85; margin-top: 4px; }
    h2 { font-size: 15px; color: var(--hint); font-weight: 500; margin: 0 0 8px 4px; }
    .list { background: var(--card); border-radius: 16px; overflow: hidden; }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid color-mix(in srgb, var(--hint) 20%, transparent);
    }
    .row:last-child { border-bottom: none; }
    .code { font-weight: 600; font-size: 16px; }
    .name { font-size: 13px; color: var(--hint); }
    .value { text-align: right; font-weight: 600; font-size: 16px; font-variant-numeric: tabular-nums; }
    .diff { font-size: 13px; font-weight: 500; }
    .diff.up { color: var(--up); }
    .diff.down { color: var(--down); }
    .meta { color: var(--hint); font-size: 12px; text-align: center; margin-top: 12px; }
    .error { color: var(--down); padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <section class="today">
    <div class="weekday" id="weekday"></div>
    <div class="date" id="date"></div>
    <div class="time" id="time"></div>
  </section>

  <h2>Курс ЦБ РФ</h2>
  <div class="list" id="rates"><div class="row"><span class="name">Загрузка…</span></div></div>
  <div class="meta" id="meta"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();

    // Какие валюты показываем и в каком порядке
    const CURRENCIES = ["USD", "EUR", "CNY", "GBP", "TRY", "KZT", "BYN"];
    const RATES_URL = "https://www.cbr-xml-daily.ru/daily_json.js";

    function renderToday() {
      const now = new Date();
      document.getElementById("weekday").textContent =
        now.toLocaleDateString("ru-RU", { weekday: "long" });
      document.getElementById("date").textContent =
        now.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
      document.getElementById("time").textContent =
        now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    }

    const fmt = (n) => n.toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 4 });

    async function loadRates() {
      const box = document.getElementById("rates");
      try {
        const res = await fetch(RATES_URL);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        box.innerHTML = "";
        for (const code of CURRENCIES) {
          const v = data.Valute[code];
          if (!v) continue;
          const diff = v.Value - v.Previous;
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <div>
              <div class="code">${v.Nominal > 1 ? v.Nominal + " " : ""}${v.CharCode}</div>
              <div class="name">${v.Name}</div>
            </div>
            <div class="value">
              ${fmt(v.Value)} ₽
              <div class="diff ${diff >= 0 ? "up" : "down"}">${diff >= 0 ? "▲" : "▼"} ${fmt(Math.abs(diff))}</div>
            </div>`;
          box.appendChild(row);
        }
        const cbrDate = new Date(data.Date).toLocaleDateString("ru-RU");
        document.getElementById("meta").textContent = "Курс установлен ЦБ на " + cbrDate;
      } catch (e) {
        box.innerHTML = `<div class="error">Не удалось загрузить курс: ${e.message}</div>`;
      }
    }

    renderToday();
    setInterval(renderToday, 30_000);
    loadRates();
  </script>
</body>
</html>
